<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial;
        }

        .form {
            background-color: #eee;
            padding: 15px;
        }

        h2 {
            padding: 15px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            margin-top: 10px;
            background-color: #0aa875;
            color: white;
            border: 0;
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>
    <body>

        <h2>Contact Form</h2>

        <div class="form">

            <label>First Name</label>
            <input type="text" placeholder="Your name..">

            <label>Last Name</label>
            <input type="text" placeholder="Your last name..">

            <label>Country</label>
            <select>
                <option>Australia</option>
                <option>Canada</option>
                <option>USA</option>
            </select>

            <label>Subject</label>
            <textarea placeholder="Write something.."></textarea>

            <button>Submit</button>

        </div>
</body>

</html>
