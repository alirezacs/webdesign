<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial;
            width: 50%;
            margin-left: 300px;
        }

        .form {
            background-color: #eee;
            padding: 15px;
        }

        h2 {
            padding: 15px;
        }

        label {
            display: block;
            margin-top: 10px;


        }

        input,select, textarea {
            width: 98%;
            padding: 8px;
        }

        textarea {
            height: 120px;
        }

        a {
            background-color: #0aa875;
            border: 0 solid #333;
            padding: 8px 15px;
            text-decoration: none;
            width: 50px;
            color: #eee;
            cursor: pointer;
            border-radius: 5px;
        }

        .button {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h2>Contact Form</h2>

    <div class="form">

        <label>First Name</label>
        <input type="textup" placeholder="Your name..">

        <label>Last Name</label>
        <input type="textdown" placeholder="Your last name..">

        <label>Country</label>
            <input type="text" placeholder="Australia">
            
        <label>Subject</label>
        <textarea placeholder="Write something.."></textarea>

        <section class="button"><a href="#">Submit</a></section>
    </div>

</body>

</html>
