
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

    <main class="container">

        <header>
            <h1>Weatherly <span>☀</span></h1>
            <p>Discover the weather in your city</p>
        </header>

        <form id="form">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..."
                required
            >
            <button type="submit">Search</button>
        </form>

        <section id="box" class="weather-box">
            <div class="welcome">
                <div class="weather-icon">🌤️</div>
                <h2>Welcome to Weatherly</h2>
                <p>Search for a city to see its current weather.</p>
            </div>
        </section>

        <footer>
            <p>Weather data provided by Open-Meteo</p>
        </footer>

    </main>

    <script src="./js/script.js"></script>
</body>
</html>
